
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SV GROUP School Management System</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
header{padding:18px 12px;text-align:center;border-bottom:1px solid #d4af37}
header h1{color:#d4af37;margin:0 0 6px;font-size:25px}
header p{margin:5px;color:#ccc}
main{max-width:800px;margin:auto;padding:16px}
.card{border:1px solid #6e5922;border-radius:12px;padding:16px;margin-bottom:16px;background:#111}
h2{color:#e4c65c;margin-top:0}
label{display:block;color:#e4c65c;margin:12px 0 6px}
input,select{width:100%;padding:12px;background:#202020;color:white;border:1px solid #665522;border-radius:7px;font-size:16px}
button{border:0;border-radius:7px;background:#d4af37;color:#080808;padding:12px;font-weight:bold;font-size:15px;cursor:pointer}
.primary{width:100%;margin-top:15px}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:15px 0}
.menu button{min-height:58px}
.secondary{background:#292929;color:#fff;border:1px solid #8a7029}
.hidden{display:none!important}
.item{padding:13px 0;border-bottom:1px solid #444;overflow-wrap:anywhere}
.small{font-size:13px;color:#bbb}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.danger{background:#a52c2c;color:white}
</style>
</head>
<body>

<header>
  <h1 id="topTitle">SV GROUP</h1>
  <p id="topSubtitle">School Management System</p>
</header>

<main>
<section id="setup" class="card hidden">
<h2>School Setup</h2>
<form id="schoolForm">
<label>School / College Name</label>
<input id="schoolName" required maxlength="150">
<label>Principal Name</label>
<input id="principalName" required maxlength="100">
<button class="primary">Save School Details</button>
</form>
</section>

<section id="dashboard" class="hidden">
<div class="card">
<h2 id="welcome"></h2>
<p id="principal"></p>
<p>कुल विद्यार्थी: <strong id="studentCount">0</strong></p>
</div>
<div class="menu">
<button onclick="openStudents()">👨‍🎓 Students & Fees</button>
<button onclick="comingSoon('Teachers')">👩‍🏫 Teachers</button>
<button onclick="comingSoon('Attendance')">📅 Attendance</button>
<button onclick="comingSoon('Exams & Results')">📝 Results</button>
<button onclick="comingSoon('Homework')">📚 Homework</button>
<button onclick="comingSoon('Time Table')">🕒 Time Table</button>
<button onclick="comingSoon('Reports')">📊 Reports</button>
</div>
<button class="secondary" onclick="editSchool()">Edit School Details</button>
</section>

<section id="students" class="hidden">
<button class="secondary" onclick="showDashboard()">← Dashboard</button>

<div class="card" style="margin-top:15px">
<h2>नया विद्यार्थी जोड़ें</h2>
<form id="studentForm">
<label>विद्यार्थी का पूरा नाम *</label>
<input id="sname" required maxlength="100">
<label>कक्षा *</label>
<select id="sclass" required>
<option value="">कक्षा चुनें</option>
<option>1</option><option>2</option><option>3</option>
<option>4</option><option>5</option><option>6</option>
<option>7</option><option>8</option><option>9</option>
<option>10</option><option>11</option><option>12</option>
</select>
<label>रोल नंबर *</label>
<input id="roll" required maxlength="30">
<label>Admission Number (अलग होना चाहिए) *</label>
<input id="admission" required maxlength="50">
<label>पिता / अभिभावक का नाम</label>
<input id="guardian" maxlength="100">
<label>मोबाइल नंबर</label>
<input id="phone" type="tel" maxlength="15">
<label>कुल फीस (₹) *</label>
<input id="totalFee" type="number" min="0" step="0.01" required>
<label>अब तक जमा फीस (₹) *</label>
<input id="paidFee" type="number" min="0" step="0.01" value="0" required>
<button class="primary">विद्यार्थी सेव करें</button>
</form>
</div>

<div class="card">
<h2>विद्यार्थी खोजें</h2>
<input id="search" placeholder="नाम, कक्षा, रोल या Admission Number">
<div id="studentList"></div>
<p id="empty" class="small">अभी कोई विद्यार्थी नहीं जोड़ा गया है।</p>
</div>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
const read = (key, fallback) => {
  try {
    const value = JSON.parse(localStorage.getItem(key));
    return value ?? fallback;
  } catch {
    return fallback;
  }
};

/* पुराने विद्यार्थी रिकॉर्ड इसी कुंजी से पढ़े जाते हैं */
let students = read("svSchoolStudents", []);
if (!Array.isArray(students)) students = [];

/* पुराने रिकॉर्ड में नई फीस की जानकारी जोड़ें */
students = students.map(s => ({
  ...s,
  admission: s.admission || ("OLD-" + (s.id || Math.random().toString(36).slice(2))),
  totalFee: Number(s.totalFee ?? 0),
  paidFee: Number(s.paidFee ?? 0)
}));

function saveStudents() {
  try {
    localStorage.setItem("svSchoolStudents", JSON.stringify(students));
    return true;
  } catch (e) {
    alert("रिकॉर्ड सेव नहीं हुआ। ब्राउज़र स्टोरेज जाँचें।");
    return false;
  }
}

function show(id) {
  ["setup", "dashboard", "students"].forEach(x =>
    $(x).classList.add("hidden")
  );
  $(id).classList.remove("hidden");

  const school = localStorage.getItem("svSchoolName") || "";
  if (id === "setup") {
    $("topTitle").textContent = "SV GROUP";
    $("topSubtitle").textContent = "School Management System";
  } else {
    $("topTitle").textContent = school || "School";
    $("topSubtitle").textContent = "School Management System";
  }
}

function init() {
  const school = localStorage.getItem("svSchoolName");
  const principal = localStorage.getItem("svPrincipalName");

  if (school && principal) {
    $("welcome").textContent = "Welcome to " + school;
    $("principal").textContent = "Principal: " + principal;
    show("dashboard");
  } else {
    $("schoolName").value = school || "";
    $("principalName").value = principal || "";
    show("setup");
  }
  updateCount();
}

$("schoolForm").addEventListener("submit", e => {
  e.preventDefault();
  const school = $("schoolName").value.trim();
  const principal = $("principalName").value.trim();
  if (!school || !principal) return;

  localStorage.setItem("svSchoolName", school);
  localStorage.setItem("svPrincipalName", principal);
  init();
});

function editSchool() {
  $("schoolName").value = localStorage.getItem("svSchoolName") || "";
  $("principalName").value = localStorage.getItem("svPrincipalName") || "";
  show("setup");
}

function showDashboard() {
  show("dashboard");
  updateCount();
}

function openStudents() {
  show("students");
  renderStudents();
}

function comingSoon(name) {
  alert(name + " मॉड्यूल अभी बनाना बाकी है।");
}

function updateCount() {
  $("studentCount").textContent = students.length;
}

$("studentForm").addEventListener("submit", e => {
  e.preventDefault();

  const totalFee = Number($("totalFee").value);
  const paidFee = Number($("paidFee").value);

  if (!Number.isFinite(totalFee) || !Number.isFinite(paidFee) ||
      totalFee < 0 || paidFee < 0 || paidFee > totalFee) {
    alert("जमा फीस 0 से कुल फीस तक होनी चाहिए।");
    return;
  }

  const admission = $("admission").value.trim();
  if (students.some(s =>
      String(s.admission).toLowerCase() === admission.toLowerCase())) {
    alert("यह Admission Number पहले से मौजूद है।");
    return;
  }

  students.push({
    id: Date.now().toString() + Math.random().toString(36).slice(2,7),
    name: $("sname").value.trim(),
    cls: $("sclass").value,
    roll: $("roll").value.trim(),
    admission,
    guardian: $("guardian").value.trim(),
    phone: $("phone").value.trim(),
    totalFee: Math.round(totalFee * 100) / 100,
    paidFee: Math.round(paidFee * 100) / 100
  });

  if (!saveStudents()) {
    students.pop();
    return;
  }

  $("studentForm").reset();
  $("paidFee").value = "0";
  $("search").value = admission;
  renderStudents();
  updateCount();
  alert("विद्यार्थी और फीस रिकॉर्ड सेव हो गया!");
});

$("search").addEventListener("input", renderStudents);

function renderStudents() {
  const q = $("search").value.trim().toLowerCase();
  const list = $("studentList");
  list.replaceChildren();

  const filtered = students.filter(s =>
    [s.name, s.cls, s.roll, s.guardian, s.phone, s.admission]
      .some(v => String(v || "").toLowerCase().includes(q))
  );

  $("empty").classList.toggle("hidden", filtered.length > 0);
  $("empty").textContent = students.length
    ? "कोई मिलान वाला रिकॉर्ड नहीं मिला।"
    : "अभी कोई विद्यार्थी नहीं जोड़ा गया है।";

  filtered.forEach(s => {
    const item = document.createElement("div");
    item.className = "item";

    const title = document.createElement("h3");
    title.style.color = "#ffe58a";
    title.textContent = s.name;

    const detail = document.createElement("p");
    detail.className = "small";
    detail.textContent =
      "कक्षा: " + s.cls + " | रोल: " + s.roll +
      " | Admission No.: " + s.admission +
      (s.guardian ? " | अभिभावक: " + s.guardian : "");

    const fees = document.createElement("p");
    fees.textContent =
      "कुल फीस: ₹" + s.totalFee.toFixed(2) +
      " | जमा: ₹" + s.paidFee.toFixed(2) +
      " | बाकी: ₹" + (s.totalFee - s.paidFee).toFixed(2);

    const label = document.createElement("label");
    label.textContent = "नई कुल जमा फीस (₹)";

    const input = document.createElement("input");
    input.type = "number";
    input.min = "0";
    input.max = String(s.totalFee);
    input.step = "0.01";
    input.value = s.paidFee;

    const update = document.createElement("button");
    update.textContent = "फीस अपडेट करें";
    update.style.marginTop = "10px";

    update.addEventListener("click", () => {
      const value = input.valueAsNumber;
      if (input.value === "" || !Number.isFinite(value) ||
          value < 0 || value > s.totalFee) {
        alert("सही फीस दर्ज करें।");
        return;
      }

      const index = students.findIndex(x => x.id === s.id);
      if (index < 0) return;

      const previous = students[index].paidFee;
      students[index].paidFee = Math.round(value * 100) / 100;

      if (saveStudents()) {
        renderStudents();
        alert("फीस रिकॉर्ड अपडेट हो गया।");
      } else {
        students[index].paidFee = previous;
      }
    });

    item.append(title, detail, fees, label, input, update);
    list.appendChild(item);
  });
}

init();
</script>
</body>
</html>
